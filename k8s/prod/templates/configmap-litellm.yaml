apiVersion: v1
kind: ConfigMap
metadata:
  name: ${configMap.name}
  namespace: ${namespace}
data:
  config.yaml: |
    ${configMap.data.config.yaml}
  
  litellm-config.json: |
    {
      "version": "1.0",
      "log_level": "${env.LOG_LEVEL}",
      "environment": "${ENVIRONMENT}",
      "database": {
        "type": "sql",
        "url_placeholder": "${DATABASE_URL_PLACEHOLDER}"
      },
      "models": [
        {
          "model_name": "gpt-4",
          "litellm_params": {
            "model": "gpt-4",
            "api_key": "${OPENAI_API_KEY_PLACEHOLDER}"
          }
        },
        {
          "model_name": "claude-3",
          "litellm_params": {
            "model": "claude-3-opus",
            "api_key": "${ANTHROPIC_API_KEY_PLACEHOLDER}"
          }
        }
      ],
      "api_settings": {
        "enable_auth": true,
        "auth_type": "jwt",
        "rate_limiting": {
          "enabled": true,
          "requests_per_minute": 60
        }
      }
    }
  
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'litellm'
        static_configs:
          - targets: ['localhost:8000']
