---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${rbac.serviceAccountName}
  namespace: ${namespace}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-role
  namespace: ${namespace}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-rolebinding
  namespace: ${namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-role
subjects:
- kind: ServiceAccount
  name: ${rbac.serviceAccountName}
  namespace: ${namespace}
