apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${deployment.name}
  namespace: ${namespace}
  labels:
    app: litellm-api
    version: ${IMAGE_TAG}
spec:
  replicas: ${deployment.replicas}
  strategy:
    type: ${deployment.strategy.type}
    rollingUpdate:
      maxSurge: ${deployment.strategy.rollingUpdate.maxSurge}
      maxUnavailable: ${deployment.strategy.rollingUpdate.maxUnavailable}
  selector:
    matchLabels:
      app: litellm-api
  template:
    metadata:
      labels:
        app: litellm-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ${rbac.serviceAccountName}
      securityContext:
        runAsNonRoot: ${podSecurityContext.runAsNonRoot}
        runAsUser: ${podSecurityContext.runAsUser}
        fsGroup: ${podSecurityContext.fsGroup}
      
      imagePullSecrets:
        - name: litellm-registry-secret
      
      containers:
      - name: litellm-api
        image: ${image.repository}:${image.tag}
        imagePullPolicy: ${image.pullPolicy}
        
        ports:
        - name: http
          containerPort: ${service.targetPort}
          protocol: TCP
        
        env:
        - name: LOG_LEVEL
          value: "${env.LOG_LEVEL}"
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: litellm-master-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: database-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: openai-api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: jwt-secret
        - name: PYTHON_ENV
          value: "production"
        
        livenessProbe:
          httpGet:
            path: ${livenessProbe.httpGet.path}
            port: ${livenessProbe.httpGet.port}
          initialDelaySeconds: ${livenessProbe.initialDelaySeconds}
          periodSeconds: ${livenessProbe.periodSeconds}
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: ${readinessProbe.httpGet.path}
            port: ${readinessProbe.httpGet.port}
          initialDelaySeconds: ${readinessProbe.initialDelaySeconds}
          periodSeconds: ${readinessProbe.periodSeconds}
          timeoutSeconds: 5
          failureThreshold: 3
        
        resources:
          requests:
            cpu: ${resources.requests.cpu}
            memory: ${resources.requests.memory}
          limits:
            cpu: ${resources.limits.cpu}
            memory: ${resources.limits.memory}
        
        securityContext:
          allowPrivilegeEscalation: ${securityContext.allowPrivilegeEscalation}
          readOnlyRootFilesystem: ${securityContext.readOnlyRootFilesystem}
          capabilities:
            drop:
              - ALL
        
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: cache
          mountPath: /tmp
        - name: data
          mountPath: ${persistentVolume.mountPath}
      
      volumes:
      - name: config
        configMap:
          name: ${configMap.name}
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: data
        persistentVolumeClaim:
          claimName: litellm-data-pvc

      nodeSelector: {}
      tolerations: []
      affinity: {}
