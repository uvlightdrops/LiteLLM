apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: ${namespace}
type: Opaque
stringData:
  litellm-master-key: ${secrets.litellm-master-key}
  database-url: ${secrets.database-url}
  database-password: ${secrets.database-password}
  openai-api-key: ${secrets.openai-api-key}
  anthropic-api-key: ${secrets.anthropic-api-key}
  cohere-api-key: ${secrets.cohere-api-key}
  azure-api-key: ${secrets.azure-api-key}
  azure-endpoint: ${secrets.azure-endpoint}
  jwt-secret: ${secrets.jwt-secret}
  jwt-algorithm: ${secrets.jwt-algorithm}
  smtp-host: ${secrets.smtp-host}
  smtp-port: ${secrets.smtp-port}
  smtp-username: ${secrets.smtp-username}
  smtp-password: ${secrets.smtp-password}
  smtp-from-email: ${secrets.smtp-from-email}
  sentry-dsn: ${secrets.sentry-dsn}
  datadog-api-key: ${secrets.datadog-api-key}
