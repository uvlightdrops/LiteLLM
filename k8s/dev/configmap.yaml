apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm-dev
data:
  litellm.yaml: |
    litellm_settings:
      drop_params: true
      set_verbose: false
      max_budget: 100
    model_list:
      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
